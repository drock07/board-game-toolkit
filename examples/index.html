<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board Game Toolkit - Examples</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='5' fill='%233b5bdb'/%3E%3Ccircle cx='11' cy='11' r='2.5' fill='%23fff'/%3E%3Ccircle cx='21' cy='21' r='2.5' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint (see src/site/theme.ts)
      try {
        const t = localStorage.getItem("theme");
        const dark =
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
